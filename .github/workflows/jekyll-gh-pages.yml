<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --ink-2:#232E3D;
    --paper:#F5EFE0;
    --paper-2:#ECE2CB;
    --gold:#C9A227;
    --rust:#A6472C;
    --ink-text:#22201B;
    --cream:#F5EFE0;
    --cream-dim:rgba(245,239,224,0.62);
    --line:rgba(245,239,224,0.16);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:460px;
    margin:0 auto;
    padding:56px 20px 40px;
    position:relative;
  }
  .hero{ text-align:center; margin-bottom:32px; }
  .badge{
    width:56px; height:56px; margin:0 auto 18px;
    border-radius:50%;
    border:1px dashed rgba(201,162,39,0.55);
    display:flex; align-items:center; justify-content:center;
  }
  .badge svg{ width:26px; height:26px; }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; font-weight:600; letter-spacing:0.18em;
    color:var(--gold); text-transform:uppercase; margin:0 0 10px;
  }
  .name{
    font-family:'Fraunces',serif; font-weight:600;
    font-size:clamp(28px,7vw,36px); margin:0 0 10px; line-height:1.1;
  }
  .bio{
    font-size:14.5px; color:var(--cream-dim); margin:0 auto 20px;
    max-width:320px; line-height:1.6;
  }
  .copy-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
    letter-spacing:0.06em; text-transform:uppercase;
    background:transparent; color:var(--cream);
    border:1px solid var(--line); border-radius:999px;
    padding:9px 18px; cursor:pointer; transition:border-color .2s, color .2s;
  }
  .copy-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .copy-btn:focus-visible, .chip:focus-visible, .card:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }

  .filters{
    display:flex; gap:8px; overflow-x:auto; padding:2px 2px 22px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
    letter-spacing:0.04em;
    background:transparent; color:var(--cream-dim);
    border:1px solid var(--line); border-radius:999px;
    padding:8px 14px; cursor:pointer; transition:all .18s;
  }
  .chip.active{ background:var(--gold); border-color:var(--gold); color:var(--ink-text); }
  .chip:not(.active):hover{ border-color:rgba(245,239,224,0.4); color:var(--cream); }

  .cards{ display:flex; flex-direction:column; gap:14px; }
  .card{
    position:relative;
    display:block; text-decoration:none;
    background:var(--paper); color:var(--ink-text);
    border-radius:6px; padding:20px 18px 18px;
    animation:riseIn .5s ease both;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .card::before{
    content:""; position:absolute; top:-1px; left:0; right:0; height:9px;
    background-image:radial-gradient(circle at 9px 0, var(--ink) 4.5px, transparent 5px);
    background-size:18px 9px; background-repeat:repeat-x;
    border-radius:6px 6px 0 0;
  }
  .card:hover{ transform:translateY(-3px) rotate(-0.4deg); background:var(--paper-2); box-shadow:0 10px 24px rgba(0,0,0,0.28); }
  .card:nth-child(even):hover{ transform:translateY(-3px) rotate(0.4deg); }
  .card:active{ transform:translateY(-1px) scale(0.99); }

  .card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .tag{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:0.05em; background:var(--rust); color:var(--cream);
    padding:3px 8px; border-radius:3px;
  }
  .arrow{ font-size:16px; color:var(--ink-text); opacity:0.5; transition:transform .18s, opacity .18s; }
  .card:hover .arrow{ transform:translateX(3px); opacity:0.85; }
  .card-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:18px;
    margin:0 0 6px; line-height:1.25;
  }
  .card-desc{ font-size:13.5px; color:rgba(34,32,27,0.68); margin:0; line-height:1.55; }

  .footer{ text-align:center; margin-top:36px; }
  .footer p{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--cream-dim);
    letter-spacing:0.03em; margin:0;
  }

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,12px);
    background:var(--gold); color:var(--ink-text);
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
    padding:10px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  @keyframes riseIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="page">

  <header class="hero">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="1.4">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>
        <path d="M9 15l2-6 6-2-2 6z" fill="#C9A227" stroke="none"/>
      </svg>
    </div>
    <p class="eyebrow">Resource Hub</p>
    <h1 class="name">347th OSS First Sergeant</h1>
    <p class="bio">Curated guides, tools, and reading — updated regularly.</p>
    <button class="copy-btn" id="copyBtn">Copy link</button>
  </header>

  <nav class="filters" id="filters" aria-label="Filter resources by category">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="guides">Guides</button>
    <button class="chip" data-filter="tools">Tools</button>
    <button class="chip" data-filter="reading">Reading</button>
    <button class="chip" data-filter="contact">Contact</button>
  </nav>

  <main class="cards" id="cardList">
    <a class="card" data-category="guides" href="#" style="animation-delay:.02s">
      <div class="card-top"><span class="tag">GDE—01</span><span class="arrow">→</span></div>
      <h2 class="card-title">Getting started guide</h2>
      <p class="card-desc">Everything you need to know before you begin.</p>
    </a>

    <a class="card" data-category="guides" href="#" style="animation-delay:.08s">
      <div class="card-top"><span class="tag">GDE—02</span><span class="arrow">→</span></div>
      <h2 class="card-title">Frequently asked questions</h2>
      <p class="card-desc">Common questions, answered plainly.</p>
    </a>

    <a class="card" data-category="tools" href="#" style="animation-delay:.14s">
      <div class="card-top"><span class="tag">TL—01</span><span class="arrow">→</span></div>
      <h2 class="card-title">Budget Calculator</h2>
      <p class="card-desc">Estimate costs in under a minute.</p>
    </a>

    <a class="card" data-category="tools" href="#" style="animation-delay:.20s">
      <div class="card-top"><span class="tag">TL—02</span><span class="arrow">→</span></div>
      <h2 class="card-title">Template library</h2>
      <p class="card-desc">Ready-to-use templates and checklists.</p>
    </a>

    <a class="card" data-category="reading" href="#" style="animation-delay:.26s">
      <div class="card-top"><span class="tag">RD—01</span><span class="arrow">→</span></div>
      <h2 class="card-title">Recommended reading</h2>
      <p class="card-desc">Five articles worth your time this month.</p>
    </a>

    <a class="card" data-category="reading" href="#" style="animation-delay:.32s">
      <div class="card-top"><span class="tag">RD—02</span><span class="arrow">→</span></div>
      <h2 class="card-title">Case studies</h2>
      <p class="card-desc">Real examples pulled from the field.</p>
    </a>

    <a class="card" data-category="contact" href="#" style="animation-delay:.38s">
      <div class="card-top"><span class="tag">CT—01</span><span class="arrow">→</span></div>
      <h2 class="card-title">Book office hours</h2>
      <p class="card-desc">30-minute slots, most weeks.</p>
    </a>

    <a class="card" data-category="contact" href="#" style="animation-delay:.44s">
      <div class="card-top"><span class="tag">CT—02</span><span class="arrow">→</span></div>
      <h2 class="card-title">Send a message</h2>
      <p class="card-desc">Questions, feedback, or ideas — all welcome.</p>
    </a>
  </main>

  <footer class="footer">
    <p>Updated <span id="stamp"></span></p>
  </footer>

</div>

<div class="toast" id="toast">Link copied</div>

<script>
  var chips = document.querySelectorAll('.chip');
  var cards = document.querySelectorAll('.card');
  chips.forEach(function(chip){
    chip.addEventListener('click', function(){
      chips.forEach(function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
      var filter = chip.dataset.filter;
      cards.forEach(function(card){
        var show = filter === 'all' || card.dataset.category === filter;
        card.style.display = show ? '' : 'none';
      });
    });
  });

  var copyBtn = document.getElementById('copyBtn');
  var toast = document.getElementById('toast');
  copyBtn.addEventListener('click', function(){
    var url = window.location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).catch(function(){});
    }
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 1800);
  });

  document.getElementById('stamp').textContent = new Date().toLocaleDateString('en-US', { month:'short', year:'numeric' });
</script>

</body>
</html>
